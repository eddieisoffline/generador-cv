# Visual theme for the CV workspace. Values come from the design system
# tokens (Papel = light, Tinta = dark); utils/ui.py styles the custom parts.
# Fonts are served locally from static/fonts (see static/fonts/README.md), so
# the app makes no requests to Google Fonts and works offline.

[server]
enableStaticServing = true

[theme]
font = "Instrument Sans, sans-serif"
headingFont = "Instrument Serif, Georgia, serif"
codeFont = "JetBrains Mono, monospace"
headingFontWeights = 400
baseFontSize = 15
baseRadius = "12px"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = false

# One entry per file: latin and latin-ext subsets. Carlito is only used by the
# CV preview in utils/ui.py.
[[theme.fontFaces]]
family = "Instrument Sans"
url = "app/static/fonts/InstrumentSans-normal-400-700-latin.woff2"
weight = "400 700"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
